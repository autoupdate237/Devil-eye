# Builds Devil's Eye as a real Windows executable on every push (and on demand).
#
# Artifacts produced:
#   * DevilsEye-windows-onefile  → single dist/DevilsEye.exe (double-click)
#   * DevilsEye-windows-onedir   → dist/DevilsEye/ folder build (fast start)
#
# Download from the Actions tab of the repository, or use:
#   gh run download <run-id> -n DevilsEye-windows-onefile
name: Build Windows EXE

on:
  push:
    branches: [main, "arena/**"]
    tags: ["v*"]
    paths-ignore: ["ci-diagnostics/**"]    # diagnostic commits must not re-trigger
  workflow_dispatch:

permissions:
  contents: write        # needed to push ci-diagnostics/ failure logs back

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      # Windows console code pages (cp1252) crash PyInstaller's Unicode
      # output when stdout is redirected; force UTF-8 everywhere.
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller

      - name: Run test suite (any-OS core tests)
        run: python -m unittest discover -s tests -v

      - name: Generate icon (in case it is missing)
        run: |
          if (-not (Test-Path packaging\devils_eye.ico)) { python scripts\make_icon.py }

      - name: Build single-file EXE
        run: python scripts\build_exe.py --onefile

      - name: Build onedir package
        run: python scripts\build_exe.py --no-clean

      - name: Upload EXE artifacts summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path dist\DevilsEye.exe) {
            "Single-file EXE built: $((Get-Item dist\DevilsEye.exe).Length) bytes" >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Smoke-test the EXE (selftest)
        run: .\dist\DevilsEye.exe selftest

      - name: Upload single-file EXE
        uses: actions/upload-artifact@v4
        with:
          name: DevilsEye-windows-onefile
          path: dist/DevilsEye.exe
          if-no-files-found: error

      - name: Upload onedir build
        uses: actions/upload-artifact@v4
        with:
          name: DevilsEye-windows-onedir
          path: dist/DevilsEye/
          if-no-files-found: error

  # -------------------------------------------------------------------
  # Publish a GitHub Release with the EXE when a version tag (v*) is pushed
  # -------------------------------------------------------------------
  release:
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package release files
        shell: pwsh
        run: |
          Copy-Item artifacts\DevilsEye-windows-onefile\DevilsEye.exe .\DevilsEye-${{ github.ref_name }}-win64.exe
          Compress-Archive artifacts\DevilsEye-windows-onedir\* DevilsEye-${{ github.ref_name }}-onedir.zip
          Get-FileHash DevilsEye-${{ github.ref_name }}-win64.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $($_.Path.Split('\')[-1])" } |
            Out-File -Encoding ascii DevilsEye-${{ github.ref_name }}-sha256.txt

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "DevilsEye-${{ github.ref_name }}-win64.exe" `
            "DevilsEye-${{ github.ref_name }}-onedir.zip" `
            "DevilsEye-${{ github.ref_name }}-sha256.txt" `
            --title "Devil's Eye ${{ github.ref_name }}" `
            --notes @"
          Devil's Eye — defensive, evidence-driven Windows anti-cheat / integrity monitor.

          **Double-click ``DevilsEye-${{ github.ref_name }}-win64.exe``** to run the full
          one-click workflow: environment check → telemetry availability → process/module/
          signature/driver/persistence inspection → correlation → risk scoring → report,
          then the dashboard opens in your browser.

          * ``DevilsEye-*-win64.exe`` — single-file executable
          * ``DevilsEye-*-onedir.zip`` — folder build (faster start, easier AV review)
          * SHA-256 checksum included for integrity verification
          "@
